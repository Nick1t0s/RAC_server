{% extends "base.html" %}
{% block title %}Вход — RAC Server{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4">
  <form method="post" action="/login" class="w-full max-w-sm bg-white shadow-md rounded-lg p-6 space-y-4">
    <h1 class="text-2xl font-semibold text-center">Вход</h1>
    {% if error %}
      <div class="bg-red-100 text-red-800 text-sm rounded p-2 text-center">{{ error }}</div>
    {% endif %}
    <label class="block">
      <span class="text-sm text-slate-600">Имя пользователя</span>
      <input type="text" name="username" required autofocus
             class="mt-1 w-full rounded border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
    </label>
    <label class="block">
      <span class="text-sm text-slate-600">Пароль</span>
      <input type="password" name="password" required
             class="mt-1 w-full rounded border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
    </label>
    <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded py-2 font-medium">
      Войти
    </button>
  </form>
</div>
{% endblock %}
